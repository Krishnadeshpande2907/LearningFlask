{% extends "base.html" %}

{% block title %}Home - My Flask App{% endblock %}

<!-- the changes can only be done in between the blocks-->
{% block content %}
    <h1>Welcome to My Flask App</h1>
    <!-- <p>This is a basic index page with a value and a number below it.</p>

    <p>Number: {{ number }}</p> -->
    
    <!-- <ul>
        {% for item in myList %}

        {% endfor %}
    </ul> -->
    
    <!-- similarly could use the variables and data for sorting or other purposes
    can use other templating features like loops and conditionals as well
    can also give it styles -->

    <form method="POST" action="{{url_for('index')}}">
        <input type="text" name="username" placeholder="username">
        <input type="password" name="password" placeholder="password">
        <input type="submit" value="Login">
    </form>

    <h1>Convert To CSV Two</h1>
    <form method="POST" action="{{url_for('convert_csv')}}" enctype="multipart/form-data">
    <input type="file" name="file" accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel">
    <input type="submit" value="Upload File">
    </form>

{% endblock %}
